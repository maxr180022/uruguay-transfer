<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RusWeo · BUSINESS</title>
<meta name="rusweo-release" content="RusWeo 4.1.0 / V121 FIX9 / business partner web 31148">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="rusweo-platform.js?v=31142"></script>
<style>
:root{--ink:#17375d;--muted:#6a7e98;--line:#dce6f3;--bg:#f5f8fc;--blue:#0a8df5;--pink:#f30884}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{width:min(680px,100%);margin:auto;padding:12px 12px 96px}.top{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:12px;background:rgba(245,248,252,.96);backdrop-filter:blur(12px)}.hero{background:linear-gradient(135deg,#fff,#f0f6ff 58%,#fff1f8);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 8px 25px rgba(22,58,103,.07)}.hero small{font-weight:900;color:#7387a1}.hero h1{font-size:25px;margin:3px 0 5px;background:linear-gradient(90deg,#0a8df5,#5b46ef,#f30884);-webkit-background-clip:text;color:transparent}.hero p{font-size:11px;color:var(--muted);margin:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tabs button{border:1px solid var(--line);border-radius:14px;background:#fff;min-height:44px;color:#49627f;font-weight:900}.tabs button.active{border:0;background:linear-gradient(100deg,#0a8df5,#5b46ef 55%,#f30884);color:#fff}.notice{display:none;border:1px solid #f3c7e4;background:#fff5fb;color:#b20b70;border-radius:14px;padding:11px;margin:10px 0;font-size:11px}.notice.show{display:block}.loading{padding:25px;text-align:center;color:#6d8098;font-size:12px}.section{display:none}.section.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:9px 0;box-shadow:0 5px 17px rgba(24,53,88,.045)}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card h3{font-size:13px;margin:0;color:#1f426a}.pill{font-size:9px;font-weight:950;padding:5px 8px;border-radius:999px;background:#eef5ff;color:#2670c8}.meta{display:grid;gap:5px;margin-top:9px;font-size:10.5px;color:#526a85}.meta b{color:#243f61}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button,.primary{border:0;border-radius:11px;min-height:38px;padding:0 10px;font-weight:900;font-size:10px}.actions .soft{background:#fff;color:#1678bf;border:1px solid #1b8df3}.actions .blue,.primary{background:linear-gradient(100deg,#0a8df5,#5b46ef 55%,#f30884);color:#fff}.actions .danger{background:#fff5fb;color:#bd0a75;border:1px solid #efb8db}.catalog-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 2px}.catalog-head h2{font-size:16px;margin:0}.catalog-head button{border:0;border-radius:12px;background:linear-gradient(100deg,#0a8df5,#5b46ef 55%,#f30884);color:#fff;min-height:39px;padding:0 12px;font-weight:900}.price{font-weight:1000;color:#245890;font-size:12px}.disabled{opacity:.55}.modal{position:fixed;inset:0;z-index:100;background:rgba(8,20,38,.48);display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{position:relative;width:min(500px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:22px;padding:15px 15px 84px;box-shadow:0 25px 70px rgba(8,27,54,.28)}.sheet h2{margin:0 0 12px;font-size:18px}.field{margin:9px 0}.field label{display:block;font-size:10px;font-weight:900;color:#5f738d;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #d7e2ef;border-radius:12px;padding:11px;font:inherit;font-size:12px;color:#17375d;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.choice-btn{border:1px solid #d7e2ef;border-radius:11px;background:#f8fbff;color:#4a627e;min-height:39px;padding:6px 8px;font:inherit;font-size:10px;font-weight:900}.choice-btn.active{border:0;background:linear-gradient(100deg,#0a8df5,#5b46ef 55%,#f30884);color:#fff}.toggle-choice{width:100%;border:1px solid #d7e2ef;border-radius:12px;min-height:42px;background:#f8fbff;color:#536b86;font:inherit;font-size:11px;font-weight:900}.toggle-choice.on{border-color:#1b8df3;background:#f1f8ff;color:#1472ba}.modal-note{font-size:10px;color:#74869c;margin-top:5px}.modal-actions{position:absolute;left:0;right:0;bottom:0;display:flex;gap:7px;padding:11px 15px calc(11px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.modal-actions button{flex:1;border:0;border-radius:12px;min-height:43px;font-weight:950}.modal-actions .cancel{background:#fff;color:#1678bf;border:1px solid #1b8df3}.modal-actions .save{background:linear-gradient(100deg,#0a8df5,#5b46ef 55%,#f30884);color:#fff}@media(max-width:380px){.grid{grid-template-columns:1fr}.app{padding-left:9px;padding-right:9px}}
</style>
</head>
<body><div class="app"><div class="top"><div class="hero"><small>ПАРТНЁР RUSWEO</small><h1>BUSINESS</h1><p>Заявки клиентов · маршруты · тарифы</p></div><div class="tabs"><button id="tabApps" class="active" onclick="showTab('apps')">Заявки</button><button id="tabCalendar" onclick="showTab('calendar')">Календарь</button><button id="tabCatalog" onclick="showTab('catalog')">Тарифы</button></div></div><div id="error" class="notice"></div><section id="apps" class="section active"><div id="appsList" class="loading">Проверяем доступ…</div></section><section id="calendar" class="section"><div id="calendarList" class="loading">Загружаем календарь…</div></section><section id="catalog" class="section"><div class="catalog-head"><h2>Маршруты и тарифы</h2><button onclick="openCatalogEditor()">＋ Добавить</button></div><div id="catalogList" class="loading">Загружаем…</div></section></div>
<div id="editModal" class="modal"><div class="sheet"><h2 id="editTitle">Маршрут / услуга</h2><input id="editId" type="hidden"><div class="field"><label>Название</label><input id="editName" placeholder="Например: Монтевидео ↔ Колония"></div><div class="field"><label>Тип цены</label><input id="editType" type="hidden" value="fixed"><div id="editTypeChoices" class="choice-grid"><button type="button" class="choice-btn" data-value="fixed" onclick="setEditChoice('editType','fixed','editTypeChoices')">Фиксированная</button><button type="button" class="choice-btn" data-value="per_km" onclick="setEditChoice('editType','per_km','editTypeChoices')">За километр</button><button type="button" class="choice-btn" data-value="per_hour" onclick="setEditChoice('editType','per_hour','editTypeChoices')">За час</button><button type="button" class="choice-btn" data-value="request" onclick="setEditChoice('editType','request','editTypeChoices')">По согласованию</button></div></div><div class="field"><label>Валюта</label><input id="editCurrency" type="hidden" value="USD"><div id="editCurrencyChoices" class="choice-grid"><button type="button" class="choice-btn" data-value="USD" onclick="setEditChoice('editCurrency','USD','editCurrencyChoices')">USD</button><button type="button" class="choice-btn" data-value="UYU" onclick="setEditChoice('editCurrency','UYU','editCurrencyChoices')">UYU</button></div></div><div class="field"><label>Цена / ставка</label><input id="editPrice" type="number" min="0" step="0.01"></div><div class="field"><label>Комментарий</label><textarea id="editNote" placeholder="Необязательно"></textarea></div><div class="field"><input id="editEnabled" type="checkbox" checked hidden><button id="editEnabledBtn" type="button" class="toggle-choice on" onclick="toggleEditEnabled()">Показывать клиентам · Да</button></div><div class="modal-actions"><button class="cancel" onclick="closeEditor()">Отмена</button><button class="save" onclick="saveCatalog()">Сохранить</button></div></div></div>
<div id="agreeModal" class="modal"><div class="sheet"><h2>Согласованная стоимость</h2><input id="agreeNumber" type="hidden"><div class="field"><label>Сумма</label><input id="agreePrice" type="number" min="0" step="0.01" placeholder="Введите сумму"></div><div class="field"><label>Валюта</label><input id="agreeCurrency" type="hidden" value="USD"><div id="agreeCurrencyChoices" class="choice-grid"><button type="button" class="choice-btn" data-value="USD" onclick="setEditChoice('agreeCurrency','USD','agreeCurrencyChoices')">USD</button><button type="button" class="choice-btn" data-value="UYU" onclick="setEditChoice('agreeCurrency','UYU','agreeCurrencyChoices')">UYU</button></div><div class="modal-note">После сохранения сумма фиксируется в заявке.</div></div><div class="field"><label>Сколько часов занять в календаре</label><input id="agreeHours" type="number" min="0.5" step="0.5" value="2"></div><div id="agreeError" class="notice"></div><div class="modal-actions"><button class="cancel" onclick="closeAgree()">Отмена</button><button class="save" onclick="saveAgreement()">Сохранить</button></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzWkerEeWR-3EjY1QW44Az6pj1TjJK9_ktfnrdcgFILlD6Cnqb4z2X97zSknKRJw-i3jw/exec';const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;let catalog=[];
try{tg&&tg.ready();tg&&tg.expand()}catch(_){}
function err(t){const e=document.getElementById('error');e.textContent=t||'';e.classList.toggle('show',!!t)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function api(params,timeout=20000){return new Promise((resolve,reject)=>{const sc=document.createElement('script');let done=false,timer=null;const cb='rw122bp_'+Date.now()+'_'+Math.random().toString(36).slice(2);window[cb]=d=>finish(null,d);function finish(e,d){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(_){}try{sc.remove()}catch(_){}e?reject(e):resolve(d)}const q=new URLSearchParams(params);q.set('init_data',String(tg&&tg.initData||''));q.set('callback',cb);q.set('_',Date.now());sc.src=API+'?'+q.toString();sc.onerror=()=>finish(new Error('Ошибка сети'));document.head.appendChild(sc);timer=setTimeout(()=>finish(new Error('Сервер отвечает слишком долго')),timeout)})}
function showTab(x){['apps','calendar','catalog'].forEach(k=>document.getElementById(k).classList.toggle('active',x===k));['Apps','Calendar','Catalog'].forEach(k=>document.getElementById('tab'+k).classList.toggle('active',x===k.toLowerCase()));if(x==='calendar')rw123BusinessLoadCalendar();if(x==='catalog')loadCatalog()}
function priceText(a){if(Number(a.final_price||0)>0)return Number(a.final_price)+' '+String(a.final_currency||a.currency||'USD');if(a.pricing_type==='fixed')return Number(a.snapshot_price||0)+' '+String(a.currency||'USD');if(Number(a.estimated_total||0)>0)return Number(a.estimated_total)+' '+String(a.currency||'USD');if(Number(a.snapshot_price||0)>0)return Number(a.snapshot_price)+' '+String(a.currency||'USD')+(a.unit?'/'+a.unit:'');return 'по согласованию'}
async function boot(){try{const me=await api({action:'v122_business_partner_me'});if(!me||!me.ok)throw new Error('Доступ BUSINESS-партнёра не подтверждён. Откройте кабинет из Telegram-бота RusWeo.');await rw122BusinessLoad()}catch(e){err(e.message||e);document.getElementById('appsList').innerHTML=''}}
async function rw122BusinessLoad(){const box=document.getElementById('appsList');box.className='loading';box.textContent='Загружаем заявки…';try{const r=await api({action:'v122_business_partner_apps'});if(!r||!r.ok)throw new Error(r&&r.error||'Ошибка');const items=Array.isArray(r.applications)?r.applications:[];box.className='';box.innerHTML=items.length?items.map(appCard).join(''):'<div class="card">Новых заявок пока нет.</div>'}catch(e){box.className='';err(e.message||e)}}
function appCard(a){const route=(Array.isArray(a.route_points)&&a.route_points.length?a.route_points:[a.point_a,a.point_b,a.point_c,a.point_d]).filter(Boolean).join(' → ');const u=String(a.telegram_username||'').replace(/^@/,'');const digits=String(a.phone||a.whatsapp||'').replace(/\D/g,'');return '<article class="card"><div class="row"><h3>'+esc(a.number)+' · '+esc(a.service_title)+'</h3><span class="pill">'+esc(a.status)+'</span></div><div class="meta"><div><b>Когда:</b> '+esc(a.date)+' · '+esc(a.time)+'</div><div><b>Маршрут:</b> '+esc(route||'—')+'</div><div><b>Клиент:</b> '+esc(a.client_name||'—')+' · '+esc(u?'@'+u:(a.phone||a.whatsapp||'—'))+'</div><div><b>Цена:</b> <span class="price">'+esc(priceText(a))+'</span></div></div><div class="actions">'+(u?'<button class="soft" onclick="openLink(\'https://t.me/'+esc(u)+'\')">💬 Клиент</button>':'')+(digits?'<button class="soft" onclick="openLink(\'https://wa.me/'+digits+'\')">WhatsApp</button>':'')+'<button class="soft" onclick="act(\''+esc(a.number)+'\',\'contacted\')">Связался</button><button class="blue" onclick="agree(\''+esc(a.number)+'\',\''+esc(a.currency||'USD')+'\')">Принять · цена/время</button><button class="blue" onclick="act(\''+esc(a.number)+'\',\'completed\')">Выполнено</button><button class="danger" onclick="act(\''+esc(a.number)+'\',\'declined\')">Отказ</button></div></article>'}
function openLink(url){try{if(tg&&tg.openTelegramLink&&/^https:\/\/t\.me\//.test(url)){tg.openTelegramLink(url);return}if(tg&&tg.openLink){tg.openLink(url);return}}catch(_){}location.href=url}
async function act(n,a,extra){try{const r=await api(Object.assign({action:'v122_business_partner_action',number:n,business_action:a},extra||{}));if(!r||!r.ok)throw new Error(r&&r.error||'Ошибка');await rw122BusinessLoad()}catch(e){err(e.message||e)}}
function setEditChoice(inputId,value,groupId){const input=document.getElementById(inputId);if(input)input.value=value;const group=document.getElementById(groupId);if(group)group.querySelectorAll('.choice-btn').forEach(b=>b.classList.toggle('active',String(b.dataset.value)===String(value)))}
function agree(n,cur){document.getElementById('agreeNumber').value=n||'';document.getElementById('agreePrice').value='';document.getElementById('agreeHours').value='2';setEditChoice('agreeCurrency',String(cur||'USD').toUpperCase()==='UYU'?'UYU':'USD','agreeCurrencyChoices');const e=document.getElementById('agreeError');e.textContent='';e.classList.remove('show');document.getElementById('agreeModal').classList.add('show');setTimeout(()=>document.getElementById('agreePrice').focus(),50)}
function closeAgree(){document.getElementById('agreeModal').classList.remove('show')}
async function saveAgreement(){const n=document.getElementById('agreeNumber').value,num=Number(String(document.getElementById('agreePrice').value||'').replace(',','.')),hours=Number(String(document.getElementById('agreeHours').value||'').replace(',','.')),cur=document.getElementById('agreeCurrency').value,e=document.getElementById('agreeError');if(!(num>0)){e.textContent='Проверьте сумму.';e.classList.add('show');return}if(!(hours>=.5)){e.textContent='Укажите длительность заказа.';e.classList.add('show');return}e.classList.remove('show');try{const r=await api({action:'v122_business_partner_action',number:n,business_action:'agreed',final_price:String(num),final_currency:String(cur||'USD').toUpperCase(),duration_hours:String(hours)});if(!r||!r.ok)throw new Error(r&&r.message||r&&r.error||'Ошибка');closeAgree();await rw122BusinessLoad()}catch(ex){e.textContent=ex.message||ex;e.classList.add('show')}}
async function rw123BusinessLoadCalendar(){const box=document.getElementById('calendarList');box.className='loading';box.textContent='Загружаем календарь…';try{const r=await api({action:'v123_business_partner_calendar'});if(!r||!r.ok)throw new Error(r&&r.error||'Ошибка');const items=Array.isArray(r.items)?r.items:[];box.className='';box.innerHTML=items.length?items.map(x=>'<article class="card"><div class="row"><h3>'+esc(x.number)+' · '+esc(x.service_title)+'</h3><span class="pill">'+esc(String(x.duration_hours||0))+' ч</span></div><div class="meta"><div><b>Начало:</b> '+esc(x.date)+' · '+esc(x.time)+'</div><div><b>Маршрут:</b> '+esc((Array.isArray(x.route_points)?x.route_points:[]).join(' → '))+'</div><div><b>Цена:</b> <span class="price">'+esc(priceText(x))+'</span></div></div></article>').join(''):'<div class="card">Принятых заказов в календаре пока нет.</div>'}catch(e){box.className='';err(e.message||e)}}
function rw122EditCatalog(id){openCatalogEditor(id)}
async function loadCatalog(){const box=document.getElementById('catalogList');box.className='loading';box.textContent='Загружаем…';try{const r=await api({action:'v122_business_partner_catalog'});if(!r||!r.ok)throw new Error(r&&r.error||'Ошибка');catalog=Array.isArray(r.catalog)?r.catalog:[];box.className='';box.innerHTML=catalog.map(catCard).join('')}catch(e){box.className='';err(e.message||e)}}
function catPrice(x){if(x.pricing_type==='request')return 'по согласованию';return Number(x.price||0)+' '+String(x.currency||'USD')+(x.pricing_type==='per_km'?'/км':x.pricing_type==='per_hour'?'/час':'')}
function catCard(x){return '<article class="card '+(x.enabled===false?'disabled':'')+'"><div class="row"><h3>'+esc(x.title)+'</h3><span class="price">'+esc(catPrice(x))+'</span></div><div class="meta">'+(x.note?'<div>'+esc(x.note)+'</div>':'')+'<div>'+(x.enabled===false?'Скрыто от клиентов':'Показывается клиентам')+'</div></div><div class="actions"><button class="soft" onclick="rw122EditCatalog(\''+esc(x.id)+'\')">Изменить</button></div></article>'}
function syncEnabledButton(){const c=document.getElementById('editEnabled'),b=document.getElementById('editEnabledBtn');if(!c||!b)return;b.classList.toggle('on',c.checked);b.textContent='Показывать клиентам · '+(c.checked?'Да':'Нет')}function toggleEditEnabled(){const c=document.getElementById('editEnabled');c.checked=!c.checked;syncEnabledButton()}
function openCatalogEditor(id){const x=catalog.find(i=>String(i.id)===String(id))||{};document.getElementById('editId').value=x.id||'';document.getElementById('editName').value=x.title||'';setEditChoice('editType',x.pricing_type||'fixed','editTypeChoices');setEditChoice('editCurrency',x.currency||'USD','editCurrencyChoices');document.getElementById('editPrice').value=x.price||0;document.getElementById('editNote').value=x.note||'';document.getElementById('editEnabled').checked=x.enabled!==false;syncEnabledButton();document.getElementById('editTitle').textContent=id?'Изменить маршрут / услугу':'Добавить маршрут / услугу';document.getElementById('editModal').classList.add('show')}
function closeEditor(){document.getElementById('editModal').classList.remove('show')}async function saveCatalog(){const item={id:document.getElementById('editId').value,title:document.getElementById('editName').value,pricing_type:document.getElementById('editType').value,currency:document.getElementById('editCurrency').value,price:Number(document.getElementById('editPrice').value||0),note:document.getElementById('editNote').value,enabled:document.getElementById('editEnabled').checked};try{const r=await api({action:'v122_business_partner_catalog_save',item_json:JSON.stringify(item)});if(!r||!r.ok)throw new Error(r&&r.error||'Ошибка');closeEditor();await loadCatalog()}catch(e){err(e.message||e)}}
boot();
</script></body></html>
