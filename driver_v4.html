<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef9fe 0,#fff 340px);color:var(--ink)}button,input,select{font:inherit}.container{width:min(100% - 30px,720px);margin:auto;padding:22px 0 34px}.driver-exit{border:0;background:transparent;color:var(--blue);font-size:16px;font-weight:850;padding:2px 0 12px;cursor:pointer}.driver-head{border:1px solid transparent;border-radius:20px;padding:12px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#1c9cc7,#6f7dd5,#ca3f84) border-box;box-shadow:0 5px 16px rgba(12,78,120,.07);margin-bottom:9px}.driver-title{text-align:center;color:var(--navy);font-size:20px;line-height:1.15;font-weight:950;margin:3px 0 12px}.driver-topline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.status-box,.head-btn{min-height:48px;border-radius:13px;padding:8px 9px;font-size:12px;line-height:1.2;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center}.status-box.ready{background:var(--green-bg);color:#246348;border:1px solid #cfe8dc}.status-box.off{background:#fff7ef;color:#8c4d20;border:1px solid #efdfce}.status-box.suspended{background:var(--red-bg);color:var(--red);border:1px solid #efd5d5}.head-btn{border:1px solid transparent;background:linear-gradient(#f8fcff,#f8fcff) padding-box,linear-gradient(135deg,#1c9cc7,#ca3f84) border-box;color:#14608f;cursor:pointer}.ready-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.ready-actions button{min-height:39px;border-radius:11px;font-size:11px;font-weight:900;border:1px solid}.ready-on{background:var(--green-bg);color:#176844;border-color:#ccebdd}.ready-off{background:var(--red-bg);color:#963333;border-color:#efd5d5}.driver-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 7px}.driver-tab{border:1px solid #d7dde5;border-radius:14px;background:#fff;color:#62778a;min-height:48px;font-weight:900;padding:7px 3px;font-size:13px}.driver-tab.active{background:var(--grad);color:#fff;border-color:transparent}.refresh{font-size:12px;color:#7c8d9b;margin:2px 0 12px}.profile-card{display:none;background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin:10px 0;box-shadow:0 5px 16px rgba(19,62,91,.05)}.profile-card.open{display:block}.profile-card h2{margin:0 0 12px;font-size:18px;color:var(--navy)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px;color:#496a7e}.field input,.field select{width:100%;min-height:44px;border:1px solid #cfdde7;border-radius:12px;padding:9px 11px;background:#fff;color:var(--ink)}.save{width:100%;min-height:44px;border:0;border-radius:12px;background:#1288c5;color:#fff;font-weight:900}.hint,.small-note{font-size:11px;color:var(--muted);line-height:1.5}.hint{margin-top:8px}.terms-warn{display:none;border:1px solid #f0dfad;background:#fff9e9;border-radius:14px;padding:12px;margin:10px 0;font-size:12px}.msg{display:none;margin-top:9px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12px}.pane{display:none}.pane.active{display:block}.loading,.empty{background:#fff;border:1px solid #e1e6ed;border-radius:20px;padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}.order-card{background:#fff;border:1px solid #dfe8ee;border-radius:19px;padding:14px;margin:9px 0;box-shadow:0 4px 13px rgba(18,63,92,.045)}.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.order-title{font-weight:950;color:var(--navy);font-size:15px}.order-price{text-align:right;white-space:nowrap;color:#0b6d9e;font-weight:950;font-size:16px}.route{font-weight:850;margin-top:8px;line-height:1.38}.meta{font-size:12px;color:#677e8e;margin-top:6px;line-height:1.48}.finance-line{margin-top:8px;padding:9px 10px;border-radius:12px;background:#f5f9fc;font-size:12px;line-height:1.5;color:#385b71}.toll-line{margin-top:7px;padding:8px 10px;border-radius:11px;background:#f4f8ff;color:#355e8b;font-size:12px;font-weight:800}.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.action{min-height:40px;border-radius:11px;padding:5px;font-size:11px;line-height:1.1;font-weight:900;border:1px solid}.accept{background:var(--green-bg);color:#176844;border-color:#ccebdd}.luggage{background:var(--amber-bg);color:#7a5310;border-color:#ead8a6}.decline{background:var(--red-bg);color:#963333;border-color:#efd5d5;grid-column:1/-1}.finance-shell{display:grid;gap:10px}.finance-card{background:#fff;border:1px solid #dfe8ee;border-radius:19px;padding:14px;box-shadow:0 4px 13px rgba(18,63,92,.045)}.finance-card h2,.finance-card h3{margin:0;color:var(--navy)}.finance-card h2{font-size:18px}.finance-card h3{font-size:16px}.month-nav{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:center;margin-bottom:10px}.month-nav button{height:38px;border:1px solid #d6e3eb;border-radius:11px;background:#fff;color:var(--blue);font-weight:950}.month-label{text-align:center;font-weight:950;color:var(--navy)}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-head span{text-align:center;font-size:10px;font-weight:900;color:#80909c;padding:4px 0}.cal-day{min-height:54px;border:1px solid #e2eaf0;border-radius:10px;padding:5px;background:#fbfdfe;position:relative}.cal-day.empty{background:transparent;border:0;padding:0}.cal-day .d{font-size:11px;font-weight:900;color:#49667a}.cal-day .marks{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}.mark{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:17px;padding:0 4px;border-radius:999px;font-size:9px;font-weight:900}.mark.plan{background:#e6f3fb;color:#17658d}.mark.done{background:#e9f7f0;color:#176844}.finance-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kpi{border:1px solid #dfe8ee;border-radius:14px;padding:11px;background:#fafdff}.kpi small{display:block;color:#728694;font-size:10px;line-height:1.3}.kpi strong{display:block;color:var(--navy);font-size:18px;line-height:1.2;margin-top:3px}.kpi.result{background:#f1fbf6;border-color:#d2ebdf}.kpi.toll{background:#f5f8ff;border-color:#dce5f4}.calendar-list{margin-top:10px}.calendar-row{padding:9px 0;border-top:1px solid #edf1f4}.calendar-row:first-child{border-top:0}.calendar-row b{font-size:12px;color:var(--navy)}.calendar-row span{display:block;font-size:11px;color:#728694;margin-top:3px}.version{text-align:center;color:#a1adb5;font-size:12px;margin-top:30px}.skeleton{height:84px;border-radius:15px;background:linear-gradient(90deg,#edf3f6,#f8fbfc,#edf3f6);background-size:200% 100%;animation:sk 1.1s infinite;margin:9px 0}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}@media(max-width:590px){.container{width:min(100% - 28px,720px);padding-top:18px}.driver-title{font-size:19px}.driver-tab{font-size:12px;min-height:46px}.grid{grid-template-columns:1fr}.finance-kpis{grid-template-columns:1fr 1fr}.order-actions{grid-template-columns:1fr}.decline{grid-column:auto}}@media(max-width:390px){.driver-topline{grid-template-columns:1fr 1fr}.status-box,.head-btn{font-size:10.5px}.driver-tab{font-size:11px;padding:6px 2px}.finance-kpis{gap:6px}.kpi{padding:9px}.kpi strong{font-size:16px}}
</style>

<body>
<div class="container">
  <button class="driver-exit" type="button" id="exitBtn">‹ Выйти из кабинета</button>

  <section class="driver-head">
    <div class="driver-title">Личный кабинет водителя</div>
    <div class="driver-topline">
      <div id="statusBox" class="status-box off">Загрузка статуса…</div>
      <button id="profileToggle" class="head-btn" type="button">👤 Профиль</button>
    </div>
    <div class="ready-actions">
      <button class="ready-on" id="readyBtn" type="button">🟢 Готов выполнять заказы</button>
      <button class="ready-off" id="notReadyBtn" type="button">🔴 Не готов</button>
    </div>
  </section>

  <div class="terms-warn" id="termsWarn">Для получения новых заявок нужно принять текущие <a id="termsLink" target="_blank" rel="noopener">условия сотрудничества</a> в Telegram-боте.</div>

  <section class="profile-card" id="profileCard">
    <h2>👤 Профиль водителя</h2>
    <div class="grid">
      <div class="field"><label>Имя (без фамилии)</label><input id="name" autocomplete="given-name"></div>
      <div class="field"><label>Телефон</label><input id="phone"></div>
      <div class="field"><label>Telegram</label><input id="telegramContact" placeholder="@username"></div>
      <div class="field"><label>Максимум клиентов</label><select id="maxPeople"></select></div>
      <div class="field"><label>Марка и модель</label><input id="vehicleMakeModel"></div>
      <div class="field"><label>Госномер</label><input id="vehiclePlate"></div>
      <div class="field"><label>Цвет автомобиля</label><input id="vehicleColor"></div>
      <div class="field"><label>Межгород</label><select id="intercity"><option value="yes">Да</option><option value="no">Нет</option></select></div>
    </div>
    <button class="save" id="saveBtn" type="button">Сохранить профиль</button>
    <div class="hint">Профиль скрыт по умолчанию. Открывайте его только для изменения данных.</div>
    <div class="msg" id="msg"></div>
  </section>

  <nav class="driver-tabs" aria-label="Разделы кабинета">
    <button class="driver-tab active" data-tab="new" type="button">Новые</button>
    <button class="driver-tab" data-tab="accepted" type="button">Принятые</button>
    <button class="driver-tab" data-tab="history" type="button">История</button>
    <button class="driver-tab" data-tab="finance" type="button">Финансы</button>
  </nav>
  <div class="refresh" id="refreshText">Загрузка…</div>

  <div class="loading" id="loading"><div>Загружаю кабинет…</div><div class="skeleton"></div><div class="skeleton"></div></div>

  <main id="app" hidden>
    <section class="pane active" id="pane-new"><div id="newOrders"></div></section>
    <section class="pane" id="pane-accepted"><div id="acceptedOrders"></div></section>
    <section class="pane" id="pane-history"><div id="historyOrders"></div></section>
    <section class="pane" id="pane-finance"><div id="finance"></div></section>
  </main>

  <div class="version">RusWeo 4.0.0 · Личный кабинет</div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const BACKEND='https://script.google.com/macros/s/AKfycbzWkerEeWR-3EjY1QW44Az6pj1TjJK9_ktfnrdcgFILlD6Cnqb4z2X97zSknKRJw-i3jw/exec';
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
try{tg&&tg.ready();tg&&tg.expand()}catch(e){}
const liveInitData=()=>String(tg&&tg.initData||'').trim();
const savedInitData=()=>{try{return String(sessionStorage.getItem('rw_tg_driver_init_data_v1')||'').trim()}catch(e){return ''}};
const initData=()=>{const live=liveInitData();if(live){try{sessionStorage.setItem('rw_tg_driver_init_data_v1',live)}catch(e){}return live}return savedInitData()};
const isAndroid=!!(window.UruWayAndroid&&typeof window.UruWayAndroid.getPlatform==='function')||(new URLSearchParams(location.search)).get('platform')==='android';
const appSession=()=>{try{return isAndroid?String(localStorage.getItem('uruway_auth_session')||''):''}catch(e){return ''}};
const tgUserId=()=>String(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id||'');
const cacheKey=()=>tgUserId()?'rw_v119_fix7_driver_dashboard_'+tgUserId():(appSession()?'rw_v119_fix7_driver_dashboard_android':'');
const $=id=>document.getElementById(id);
let dashboard=null,seq=0,lastTab='new',financeMonth=currentMonthKey();
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='rwV119Cb'+Date.now()+(++seq);const script=document.createElement('script');const base={action,callback:cb,...params};const init=initData(),session=appSession();if(init)base.init_data=init;if(session)base.app_session=session;const q=new URLSearchParams(base);const timer=setTimeout(()=>done(new Error('Сервер отвечает слишком долго')),15000);function done(err,val){clearTimeout(timer);try{delete window[cb]}catch(e){};script.remove();err?reject(err):resolve(val)}window[cb]=r=>done(null,r);script.onerror=()=>done(new Error('Ошибка сети'));script.src=BACKEND+'?'+q.toString();document.head.appendChild(script)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){const n=Number(v||0);return Number.isFinite(n)?Math.round(n).toLocaleString('ru-RU')+' UYU':'—'}
function usd(v){const n=Number(v||0);return Number.isFinite(n)?'$'+(Math.round(n*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:2}):'—'}
function num(v){const n=Number(v||0);return Number.isFinite(n)?n:0}
function message(text,bad=false){const el=$('msg');el.style.display='block';el.textContent=text;el.style.background=bad?'#fff1f1':'#f1f8fb';setTimeout(()=>el.style.display='none',3500)}
function setRefresh(text){$('refreshText').textContent=text}
function stamp(){try{return new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Montevideo'}).format(new Date())}catch(e){return new Date().toLocaleTimeString().slice(0,5)}}
function currentMonthKey(){try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Montevideo',year:'numeric',month:'2-digit'}).formatToParts(new Date());const y=parts.find(x=>x.type==='year').value,m=parts.find(x=>x.type==='month').value;return y+'-'+m}catch(e){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}}
function monthLabel(key){const m=String(key||'').match(/^(\d{4})-(\d{2})$/);if(!m)return key;const d=new Date(Number(m[1]),Number(m[2])-1,1);return new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(d)}
function shiftMonth(key,delta){const m=String(key).match(/^(\d{4})-(\d{2})$/);if(!m)return currentMonthKey();const d=new Date(Number(m[1]),Number(m[2])-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function localMonthFromIso(raw){if(!raw)return '';try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Montevideo',year:'numeric',month:'2-digit'}).formatToParts(new Date(raw));const y=parts.find(x=>x.type==='year').value,m=parts.find(x=>x.type==='month').value;return y+'-'+m}catch(e){return ''}}
function orderMonth(o){if(o&&o.history_completed&&o.final_closed_at){const k=localMonthFromIso(o.final_closed_at);if(k)return k}return String(o&&o.date||'').slice(0,7)}
function saveCache(d){const k=cacheKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify({at:Date.now(),data:d}))}catch(e){}}
function readCache(){const k=cacheKey();if(!k)return null;try{const x=JSON.parse(localStorage.getItem(k)||'null');if(!x||!x.data||Date.now()-Number(x.at||0)>6*60*60*1000)return null;return x.data}catch(e){return null}}
function fillProfile(d){d=d||{};$('name').value=d.name||'';$('phone').value=d.phone||'';$('telegramContact').value=d.telegram_contact||'';$('vehicleMakeModel').value=d.vehicle_make_model||'';$('vehiclePlate').value=d.vehicle_plate||'';$('vehicleColor').value=d.vehicle_color||'';$('maxPeople').value=String(d.max_people||4);$('intercity').value=d.intercity_allowed?'yes':'no';const b=$('statusBox');b.className='status-box '+(d.suspended?'suspended':(d.accepting_orders?'ready':'off'));b.textContent=d.suspended?'⛔ Профиль приостановлен':(d.accepting_orders?'🟢 Готов принимать новые заказы':(!d.profile_complete?'⚠️ Заполните профиль':'🔴 Новые заказы выключены'));$('termsWarn').style.display=d.terms_current?'none':'block';$('termsLink').href=d.terms_url||'#';$('readyBtn').disabled=!!d.suspended;$('notReadyBtn').disabled=!!d.suspended}
function baggageText(o){if(num(o.bags_l)||num(o.bags_m))return num(o.bags_l)+' L · '+num(o.bags_m)+' M';return num(o.bags)+' шт.'}
function orderCard(o,kind){const c=o.commission||{};const customerFare=o.price?esc(o.price)+' '+esc(o.currency||''):money(c.fare_uyu);const remainder=num(c.driver_remainder_uyu)>0?money(c.driver_remainder_uyu):'—';const tollCount=Math.max(0,Math.round(num(o.toll_count)));const tollCost=money(o.toll_uyu);const contacts=o.assigned&&((o.client_name||'')||(o.client_phone||'')||(o.client_telegram||''))?'<div class="meta"><b>Клиент:</b> '+esc(o.client_name||'')+(o.client_phone?' · '+esc(o.client_phone):'')+(o.client_telegram?' · '+esc(o.client_telegram):'')+'</div>':'';let econ='';if(kind!=='new'&&num(c.driver_remainder_uyu)>0){econ='<div class="finance-line"><b>Вам после комиссии:</b> '+remainder+'<br><b>Комиссия RusWeo:</b> '+money(c.commission_uyu)+(num(o.actual_work_km)>0?'<br><b>Фактический пробег:</b> '+esc(o.actual_work_km)+' км · 13 UYU/км = −'+money(o.operating_cost_uyu)+(o.estimated_net_after_commission_km_tolls_uyu!==null?'<br><b>Ориентировочный итог:</b> '+money(o.estimated_net_after_commission_km_tolls_uyu):''):'')+'</div>'}
const actions=kind==='new'?'<div class="order-actions"><button class="action accept" onclick="offerAction(\''+esc(o.number)+'\',\'accept\')">✅ Принять</button><button class="action luggage" onclick="offerAction(\''+esc(o.number)+'\',\'luggage\')">🧳 Багаж не помещается</button><button class="action decline" onclick="offerAction(\''+esc(o.number)+'\',\'decline\')">❌ Не могу выполнить</button></div>':'';
return '<article class="order-card"><div class="order-top"><div class="order-title">№'+esc(o.number)+' · '+esc(o.service_name||o.status_text||'Заявка')+'</div><div class="order-price">'+customerFare+'</div></div><div class="route">'+esc(o.date)+' · '+esc(o.time)+'<br>'+esc(o.route_text)+'</div><div class="meta">Люди: '+esc(o.passengers)+' · Багаж: '+esc(baggageText(o))+'</div><div class="toll-line">🛣 Платные дороги: '+tollCount+' × '+esc(o.toll_rate_uyu||214)+' UYU = '+tollCost+'</div>'+(o.comment?'<div class="meta">Комментарий: '+esc(o.comment)+'</div>':'')+contacts+econ+actions+'</article>'}
function renderList(id,list,kind,empty){$(id).innerHTML=list.length?list.map(o=>orderCard(o,kind)).join(''):'<div class="empty">'+empty+'</div>'}
function calendarHtml(orders,key){const m=String(key).match(/^(\d{4})-(\d{2})$/);if(!m)return '';const y=Number(m[1]),mo=Number(m[2]);const days=new Date(y,mo,0).getDate(),first=(new Date(y,mo-1,1).getDay()+6)%7;const map={};orders.forEach(o=>{if(String(o.date||'').slice(0,7)!==key)return;const day=Number(String(o.date||'').slice(8,10));if(!day)return;const x=map[day]||(map[day]={plan:0,done:0});if(o.bucket==='accepted')x.plan++;if(o.bucket==='history'&&o.history_completed)x.done++});let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-day empty"></div>';for(let d=1;d<=days;d++){const x=map[d]||{};cells+='<div class="cal-day"><div class="d">'+d+'</div><div class="marks">'+(x.plan?'<span class="mark plan">План '+x.plan+'</span>':'')+(x.done?'<span class="mark done">✓ '+x.done+'</span>':'')+'</div></div>'}return '<div class="cal-head"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="cal-grid">'+cells+'</div>'}
function financeTotals(orders,key){const done=orders.filter(o=>o.bucket==='history'&&o.history_completed&&orderMonth(o)===key);const t=done.reduce((a,o)=>{const c=o.commission||{};a.orders++;a.remainder+=num(c.driver_remainder_uyu);a.commission+=num(c.commission_uyu);a.km+=num(o.actual_work_km);a.cost+=num(o.operating_cost_uyu);a.tolls+=num(o.toll_count);a.tollU+=num(o.toll_uyu);if(num(o.actual_work_km)>0)a.withKm++;return a},{orders:0,remainder:0,commission:0,km:0,cost:0,tolls:0,tollU:0,withKm:0});t.net=(t.orders===0)?0:(t.withKm===t.orders?t.remainder-t.cost-t.tollU:null);return t}
function financeSchedule(orders,key){const list=orders.filter(o=>(o.bucket==='accepted'||(o.bucket==='history'&&o.history_completed))&&String(o.date||'').slice(0,7)===key).slice().sort((a,b)=>String(a.date+' '+a.time).localeCompare(String(b.date+' '+b.time)));if(!list.length)return '<div class="small-note">За выбранный месяц запланированных или выполненных заявок нет.</div>';return '<div class="calendar-list">'+list.map(o=>'<div class="calendar-row"><b>'+esc(o.date)+' · '+esc(o.time)+' · №'+esc(o.number)+'</b><span>'+esc(o.route_text)+' · '+(o.bucket==='accepted'?'планируется':'выполнена')+'</span></div>').join('')+'</div>'}
function renderFinance(){if(!dashboard)return;const orders=Array.isArray(dashboard.orders)?dashboard.orders:[];const t=financeTotals(orders,financeMonth);const net=t.net===null?'—':money(t.net);$('finance').innerHTML='<div class="finance-shell"><section class="finance-card"><div class="month-nav"><button type="button" onclick="changeFinanceMonth(-1)">‹</button><div class="month-label">'+esc(monthLabel(financeMonth))+'</div><button type="button" onclick="changeFinanceMonth(1)">›</button></div><h3>📅 Рабочий календарь</h3>'+calendarHtml(orders,financeMonth)+'<div class="small-note">План — принятые будущие заявки · ✓ — выполненные заявки.</div>'+financeSchedule(orders,financeMonth)+'</section><section class="finance-card"><h2>Финансы за месяц</h2><div class="finance-kpis"><div class="kpi"><small>Выполнено заказов</small><strong>'+t.orders+'</strong></div><div class="kpi"><small>После комиссии RusWeo</small><strong>'+money(t.remainder)+'</strong></div><div class="kpi"><small>Комиссия RusWeo</small><strong>−'+money(t.commission)+'</strong></div><div class="kpi"><small>Фактический пробег</small><strong>'+Math.round(t.km*10)/10+' км</strong></div><div class="kpi"><small>13 UYU/км</small><strong>−'+money(t.cost)+'</strong></div><div class="kpi toll"><small>🛣 Платные дороги · '+Math.round(t.tolls)+' проезд.</small><strong>−'+money(t.tollU)+'</strong></div><div class="kpi result"><small>Ориентировочный итог</small><strong>'+net+'</strong></div></div><div class="small-note"><b>13 UYU/км</b> — ориентировочная себестоимость водителя: страховка, шины, ТО, топливо/энергия. <b>Платные дороги вычитаются отдельно.</b> Комиссия RusWeo также показана отдельно. Это справочный расчёт, не бухгалтерская отчётность.'+(t.orders>0&&t.withKm<t.orders?' Для части заказов ещё нет фактического пробега, поэтому итог не рассчитывается до появления этих данных.':'')+'</div></section></div>'}
window.changeFinanceMonth=delta=>{financeMonth=shiftMonth(financeMonth,delta);renderFinance()};
function render(d,fromCache=false){dashboard=d;fillProfile(d.profile||{});const orders=Array.isArray(d.orders)?d.orders:[];const fresh=orders.filter(o=>o.bucket==='new'),accepted=orders.filter(o=>o.bucket==='accepted'),history=orders.filter(o=>o.bucket==='history');renderList('newOrders',fresh,'new','Новых заявок сейчас нет.');renderList('acceptedOrders',accepted,'accepted','Принятых заявок сейчас нет.');renderList('historyOrders',history,'history','История пока пуста.');renderFinance();$('loading').hidden=true;$('app').hidden=false;setRefresh(fromCache?'Показаны сохранённые данные · обновляю в фоне':'Обновлено в фоне · '+stamp())}
async function load(){if(!initData()&&!appSession())throw new Error('Откройте кабинет из Telegram-бота RusWeo или войдите через Telegram в Android-приложении.');const r=await api('v119_external_driver_dashboard');if(!r||!r.ok)throw new Error((r&&r.error)||'Нет доступа');render(r,false);saveCache(r);return r}
window.offerAction=async(number,action)=>{const label=action==='accept'?'принять заявку':action==='luggage'?'указать, что багаж не помещается':'отказаться от заявки';if(!confirm('Подтвердить: '+label+' №'+number+'?'))return;try{setRefresh('Сохраняю действие…');const r=await api('v119_external_driver_offer_action',{booking_number:number,offer_action:action});if(!r||!r.ok)throw new Error((r&&r.error)||'Не удалось выполнить действие');await load()}catch(e){alert(e.message);setRefresh('Ошибка обновления')}};
$('maxPeople').innerHTML=Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');
$('profileToggle').onclick=()=>{$('profileCard').classList.toggle('open');$('profileToggle').textContent=$('profileCard').classList.contains('open')?'✕ Закрыть профиль':'👤 Профиль'};
$('readyBtn').onclick=async()=>{try{setRefresh('Меняю статус…');const r=await api('v119_external_driver_ready',{ready:'1'});if(!r.ok){if(r.error==='terms_update_required')throw new Error('Сначала примите обновлённые условия в Telegram-боте.');if(r.error==='profile_incomplete')throw new Error('Сначала заполните профиль автомобиля и контакты.');if(r.error==='driver_suspended')throw new Error('Профиль приостановлен администратором.');throw new Error(r.error)}await load()}catch(e){alert(e.message)}};
$('notReadyBtn').onclick=async()=>{try{setRefresh('Меняю статус…');const r=await api('v119_external_driver_ready',{ready:'0'});if(!r.ok)throw new Error(r.error);await load()}catch(e){alert(e.message)}};
$('saveBtn').onclick=async()=>{const b=$('saveBtn');b.disabled=true;try{const r=await api('v119_external_driver_profile_save',{name:$('name').value,phone:$('phone').value,telegram_contact:$('telegramContact').value,vehicle_make_model:$('vehicleMakeModel').value,vehicle_plate:$('vehiclePlate').value,vehicle_color:$('vehicleColor').value,max_people:$('maxPeople').value,intercity_allowed:$('intercity').value==='yes'?'1':'0'});if(!r.ok)throw new Error(r.error);message('Профиль сохранён');$('profileCard').classList.remove('open');$('profileToggle').textContent='👤 Профиль';await load()}catch(e){message(e.message,true)}finally{b.disabled=false}};
document.querySelectorAll('.driver-tab').forEach(btn=>btn.onclick=()=>{lastTab=btn.dataset.tab;document.querySelectorAll('.driver-tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id==='pane-'+lastTab));if(lastTab==='finance')renderFinance()});
$('exitBtn').onclick=()=>{try{if(history.length>1){history.back();return}}catch(e){}location.href='index.html?v=31119&fix=7'};
const cached=readCache();if(cached)render(cached,true);
load().catch(e=>{if(!cached){$('loading').innerHTML='Ошибка: '+esc(e.message)}else{setRefresh('Не удалось обновить · показаны сохранённые данные')}});
</script>
</body>
