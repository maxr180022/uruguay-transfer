<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Uruguay Transfer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#f5f7fa;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#1593e8;--border:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .app{max-width:520px;margin:0 auto;padding:18px 16px 34px}
    .hero{padding:18px 4px 14px}.logo{width:58px;height:58px;border-radius:18px;background:#35c759;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;box-shadow:0 8px 20px rgba(53,199,89,.2)}
    h1{font-size:27px;margin:14px 0 5px}.subtitle{color:var(--muted);font-size:15px;line-height:1.45}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
    select,input{width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;padding:13px 12px;font-size:16px;outline:none;color:var(--text)}
    select:focus,input:focus{border-color:var(--accent)}
    .field{margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .price{display:flex;align-items:end;justify-content:space-between;margin-top:5px;gap:12px}.price .amount{font-size:27px;font-weight:800;text-align:right}.price small{color:var(--muted)}
    button{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:750;cursor:pointer}.primary{width:100%;background:var(--accent);color:#fff;margin-top:15px}.secondary{width:100%;background:#eef6fd;color:#0b78bf;margin-top:10px}
    .note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:11px}.hidden{display:none!important}.success{border-color:#b7e4c7;background:#f0fff4}.success h2{margin:0 0 8px;font-size:21px}.summary{font-size:14px;line-height:1.65}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--border);padding:7px 0}.row:last-child{border-bottom:0}.row b{text-align:right}
    .service-description{font-size:12px;color:var(--muted);line-height:1.4;margin-top:-7px;margin-bottom:15px}
  </style>
</head>
<body>
<main class="app">
  <section class="hero">
    <div class="logo">UT</div>
    <h1>Uruguay Transfer</h1>
    <div class="subtitle">Предварительное бронирование трансфера в Уругвае</div>
  </section>

  <section class="card" id="bookingCard">
    <div class="field">
      <label for="service">Услуга</label>
      <select id="service">
        <optgroup label="✈️ Аэропорт Караско — Монтевидео">
          <option value="mvd_to_mvd_airport">Монтевидео → аэропорт Караско (MVD) — 70 USD</option>
          <option value="airport_to_mvd">Аэропорт Караско (MVD) → Монтевидео — 70 USD</option>
        </optgroup>
        <optgroup label="⛴️ Buquebus — Монтевидео">
          <option value="buquebus_to_mvd">Buquebus → Монтевидео — 70 USD</option>
          <option value="mvd_to_buquebus">Монтевидео → Buquebus — 70 USD</option>
        </optgroup>
        <optgroup label="✈️ Аэропорт Караско — Пунта-дель-Эсте">
          <option value="airport_to_pde">Аэропорт Караско (MVD) → Пунта-дель-Эсте — 190 USD</option>
          <option value="pde_to_airport">Пунта-дель-Эсте → аэропорт Караско (MVD) — 190 USD</option>
        </optgroup>
        <optgroup label="⛴️ Buquebus — Пунта-дель-Эсте">
          <option value="buquebus_to_pde">Buquebus → Пунта-дель-Эсте — 200 USD</option>
          <option value="pde_to_buquebus">Пунта-дель-Эсте → Buquebus — 200 USD</option>
        </optgroup>
        <optgroup label="🌴 Монтевидео — Пунта-дель-Эсте">
          <option value="mvd_to_pde">Монтевидео → Пунта-дель-Эсте — 190 USD</option>
          <option value="pde_to_mvd">Пунта-дель-Эсте → Монтевидео — 190 USD</option>
          <option value="mvd_pde_day">Монтевидео → Пунта-дель-Эсте → Монтевидео — 275 USD / весь день</option>
          <option value="pde_mvd_day">Пунта-дель-Эсте → Монтевидео → Пунта-дель-Эсте — 275 USD / весь день</option>
        </optgroup>
        <option value="hourly">🚗 Автомобиль с водителем по Монтевидео и ближайшим окрестностям — 650 UYU/час</option>
      </select>
    </div>

    <div class="service-description" id="serviceDescription"></div>

    <div class="grid">
      <div class="field"><label for="date">Дата</label><input id="date" type="date"></div>
      <div class="field"><label for="time">Время</label><input id="time" type="time"></div>
    </div>

    <div class="grid">
      <div class="field"><label for="passengers">Пассажиры</label><select id="passengers"><option>1</option><option>2</option><option>3</option></select></div>
      <div class="field"><label for="bags">Багаж</label><select id="bags"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>

    <div class="field"><label for="from">Откуда</label><input id="from" placeholder="Например: аэропорт MVD"></div>
    <div class="field"><label for="to">Куда</label><input id="to" placeholder="Например: Punta del Este"></div>
    <div class="field"><label for="contact">Телефон или другой контакт</label><input id="contact" placeholder="+598 ..."></div>

    <div class="price"><small id="priceLabel">Стоимость услуги</small><div class="amount" id="price">—</div></div>
    <button class="primary" id="submit">Отправить заявку</button>
    <div class="note">Заявка является предварительной. После получения заявки водитель вручную подтверждает бронирование.</div>
  </section>

  <section class="card success hidden" id="successCard">
    <h2>Заявка отправлена</h2><div class="summary" id="summary"></div>
    <button class="secondary" id="back">Изменить заявку</button>
  </section>
</main>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();document.documentElement.style.setProperty('--accent',tg.themeParams.button_color||'#1593e8')}
const $=id=>document.getElementById(id);
const service=$('service'),date=$('date'),time=$('time'),passengers=$('passengers'),bags=$('bags'),from=$('from'),to=$('to'),contact=$('contact'),price=$('price'),priceLabel=$('priceLabel'),serviceDescription=$('serviceDescription');

const today=new Date(),yyyy=today.getFullYear(),mm=String(today.getMonth()+1).padStart(2,'0'),dd=String(today.getDate()).padStart(2,'0');
date.min=`${yyyy}-${mm}-${dd}`;date.value=`${yyyy}-${mm}-${dd}`;

defaults={
  mvd_to_mvd_airport:{price:70,currency:'USD',description:'Поездка в одну сторону: Монтевидео → международный аэропорт Караско (MVD).'},
  airport_to_mvd:{price:70,currency:'USD',description:'Поездка в одну сторону: международный аэропорт Караско (MVD) → Монтевидео.'},
  buquebus_to_mvd:{price:70,currency:'USD',description:'Поездка в одну сторону: терминал Buquebus → Монтевидео.'},
  mvd_to_buquebus:{price:70,currency:'USD',description:'Поездка в одну сторону: Монтевидео → терминал Buquebus.'},
  airport_to_pde:{price:190,currency:'USD',description:'Поездка в одну сторону: аэропорт Караско (MVD) → Пунта-дель-Эсте.'},
  pde_to_airport:{price:190,currency:'USD',description:'Поездка в одну сторону: Пунта-дель-Эсте → аэропорт Караско (MVD).'},
  buquebus_to_pde:{price:200,currency:'USD',description:'Поездка в одну сторону: терминал Buquebus → Пунта-дель-Эсте.'},
  pde_to_buquebus:{price:200,currency:'USD',description:'Поездка в одну сторону: Пунта-дель-Эсте → терминал Buquebus.'},
  mvd_to_pde:{price:190,currency:'USD',description:'Поездка в одну сторону: Монтевидео → Пунта-дель-Эсте.'},
  pde_to_mvd:{price:190,currency:'USD',description:'Поездка в одну сторону: Пунта-дель-Эсте → Монтевидео.'},
  mvd_pde_day:{price:275,currency:'USD',description:'Поездка на весь день: Монтевидео → Пунта-дель-Эсте → Монтевидео. Время: 09:00–20:00. Включает дорогу туда и обратно, ожидание и возможность посещения различных локаций.'},
  pde_mvd_day:{price:275,currency:'USD',description:'Поездка на весь день: Пунта-дель-Эсте → Монтевидео → Пунта-дель-Эсте. Время: 09:00–20:00. Включает дорогу туда и обратно, ожидание и возможность посещения различных локаций.'},
  hourly:{price:650,currency:'UYU',description:'Личный водитель по Монтевидео и ближайшим окрестностям — 650 UYU/час. Минимальный заказ — 3 часа. Итого минимум: 1 950 UYU.'}
};

function money(n,c){return n.toLocaleString('ru-RU')+' '+c}
function calculate(){
  const s=defaults[service.value];
  let p=s.price;
  if(service.value==='hourly') p=1950;
  priceLabel.textContent=service.value==='hourly'?'Стоимость (минимум 3 часа)':'Стоимость услуги';
  price.textContent=money(p,s.currency);
  serviceDescription.textContent=s.description;
  return {price:p,currency:s.currency};
}
[service,time].forEach(el=>el.addEventListener('change',calculate));
calculate();

$('submit').addEventListener('click',()=>{
  if(!date.value||!time.value||!from.value.trim()||!to.value.trim()||!contact.value.trim()){alert('Пожалуйста, заполните дату, время, маршрут и контакт.');return}
  const result=calculate(),selected=service.options[service.selectedIndex].text;
  $('summary').innerHTML=`<div class="row"><span>Услуга</span><b>${selected}</b></div><div class="row"><span>Дата</span><b>${date.value}</b></div><div class="row"><span>Время</span><b>${time.value}</b></div><div class="row"><span>Маршрут</span><b>${from.value} → ${to.value}</b></div><div class="row"><span>Пассажиры</span><b>${passengers.value}</b></div><div class="row"><span>Багаж</span><b>${bags.value}</b></div><div class="row"><span>Контакт</span><b>${contact.value}</b></div><div class="row"><span>Стоимость</span><b>${money(result.price,result.currency)}</b></div>`;
  $('bookingCard').classList.add('hidden');$('successCard').classList.remove('hidden');
  if(tg)tg.sendData(JSON.stringify({service:service.value,service_name:selected,date:date.value,time:time.value,from:from.value,to:to.value,passengers:passengers.value,bags:bags.value,contact:contact.value,price:result.price,currency:result.currency}));
});
$('back').addEventListener('click',()=>{$('successCard').classList.add('hidden');$('bookingCard').classList.remove('hidden')});
</script>
</body>
</html>
