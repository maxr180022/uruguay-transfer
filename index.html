<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>UruWay Transfer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--navy:#07356f;--blue:#087eea;--cyan:#12b8ff;--text:#0a1f44;--muted:#6b82a2;--border:#d9ebf8;--green:#0d9154}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 88% 6%,rgba(18,184,255,.16),transparent 30%),linear-gradient(180deg,#eaf7ff 0%,#f8fcff 52%,#edf7ff 100%)}button{font:inherit;cursor:pointer}.screen{display:none;min-height:100vh}.screen.active{display:block}.container{width:min(100%,720px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:center;align-items:center;margin:4px 0 10px}.brand{font-size:25px;font-weight:950;color:var(--navy);letter-spacing:-.03em}.brand span{color:#0aa7ef}
.hero-card{position:relative;overflow:hidden;border-radius:29px;border:1px solid rgba(96,205,255,.75);padding:18px 18px 15px;color:#fff;background:radial-gradient(circle at 83% 14%,rgba(40,220,255,.74),transparent 29%),linear-gradient(135deg,#063c8d 0%,#006ed6 55%,#09aef2 100%);box-shadow:0 18px 42px rgba(0,91,181,.24)}.kicker{display:inline-flex;position:relative;z-index:4;padding:7px 11px;border-radius:999px;background:rgba(0,128,255,.82);border:1px solid rgba(255,255,255,.22);font-size:11px;font-weight:900}.hero-grid{display:grid;grid-template-columns:45% 55%;align-items:center;min-height:215px}.hero-copy{position:relative;z-index:4}.standard{font-size:36px;line-height:.95;font-weight:1000;letter-spacing:-.035em}.carname{font-size:18px;font-weight:900;margin-top:8px}.specs{display:grid;gap:8px;margin-top:14px;font-size:13px;font-weight:700}.spec{display:flex;gap:8px;align-items:center}.dot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#0a91f1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.carbox{height:220px;display:flex;align-items:center;justify-content:center;position:relative;z-index:3}.carbox img{width:158%;max-width:none;height:auto;transform:translate(4%,5%);filter:drop-shadow(0 16px 12px rgba(0,26,62,.33))}.book{position:relative;z-index:6;width:100%;border:1px solid rgba(255,255,255,.72);border-radius:22px;padding:14px 15px;background:linear-gradient(180deg,#17c1ff,#087ae9);color:#fff;font-size:17px;font-weight:950;box-shadow:0 9px 24px rgba(0,77,220,.28)}
.partners{margin-top:15px}.partners-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 9px}.partners-title{font-size:28px;font-weight:1000;color:#082b62;letter-spacing:-.03em}.verified{font-size:10px;font-weight:900;color:#075ea9;background:rgba(255,255,255,.78);border:1px solid #d4eaff;border-radius:999px;padding:7px 10px;white-space:nowrap}.list{display:grid;gap:9px}.partner{width:100%;border:1px solid #dbeaf5;border-radius:21px;background:rgba(255,255,255,.94);box-shadow:0 7px 20px rgba(16,74,125,.07);padding:11px 12px;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:11px;text-align:left}.partner:active{transform:scale(.993)}.picon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#e8f7ff,#d8efff)}.ptitle{font-size:18px;font-weight:1000;color:#081f4d}.pmeta{font-size:12px;color:#6682a5;margin-top:4px;line-height:1.25}.paction{display:grid;justify-items:end;gap:5px}.badge{color:#098846;background:#e8f9ef;border:1px solid #c5efd5;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;white-space:nowrap}.contact{color:#0784df;font-size:13px;font-weight:950;white-space:nowrap}.booking{background:#fff;height:100vh;overflow:hidden}.booking iframe{display:block;width:100%;height:100vh;border:0}.version{text-align:center;color:#7d94ae;font-size:10px;margin-top:12px}
@media(max-width:390px){.standard{font-size:31px}.hero-grid{min-height:184px}.carbox{height:186px}.carbox img{width:168%}.partners-title{font-size:24px}.verified{font-size:9px}.pmeta{font-size:11px}.partner{grid-template-columns:48px 1fr auto}.picon{width:48px;height:48px}}
</style>
</head>
<body>
<section id="hub" class="screen active"><div class="container">
  <div class="top"><div class="brand">Uru<span>Way</span> Transfer</div></div>
  <div class="hero-card">
    <div class="kicker">🚗&nbsp; Основная услуга UruWay</div>
    <div class="hero-grid"><div class="hero-copy">
      <div class="standard">STANDARD</div><div class="carname">Renault Kwid</div>
      <div class="specs"><div class="spec"><span class="dot">👤</span><span>До 3 пассажиров</span></div><div class="spec"><span class="dot">🧳</span><span>До 3 чемоданов</span></div><div class="spec"><span class="dot">✓</span><span>Комфорт и надёжность</span></div></div>
    </div><div class="carbox"><img src="assets/renault_kwid_v39.png" alt="Renault Kwid STANDARD"></div></div>
    <button class="book" type="button" onclick="openBooking()">🗓️ &nbsp;Забронировать трансфер &nbsp;→</button>
  </div>
  <div class="partners"><div class="partners-head"><div class="partners-title">Наши партнёры</div><div class="verified">🤝 Проверенные партнёры</div></div>
    <div class="list">
      <button class="partner" onclick="openPartner('business','AVladimirovich')"><div class="picon">🚐</div><div><div class="ptitle">BUSINESS</div><div class="pmeta">Hyundai H-1 · до 8 пассажиров</div></div><div class="paction"><div class="badge">Наш партнёр</div><div class="contact">Связаться ↗</div></div></button>
      <button class="partner" onclick="openPartner('documents','mapsme')"><div class="picon">📄</div><div><div class="ptitle">Документы</div><div class="pmeta">ВНЖ / ПМЖ · ИП · банковские счета</div></div><div class="paction"><div class="badge">Наш партнёр</div><div class="contact">Связаться ↗</div></div></button>
      <button class="partner" onclick="openPartner('realestate','niko_uruguay')"><div class="picon">🏠</div><div><div class="ptitle">Недвижимость</div><div class="pmeta">Аренда · покупка · продажа</div></div><div class="paction"><div class="badge">Наш партнёр</div><div class="contact">Связаться ↗</div></div></button>
    </div>
  </div>
  <div class="version">UruWay Telegram Mini App · V39</div>
</div></section>
<section id="booking" class="screen booking"><iframe id="bookingFrame" title="Бронирование UruWay"></iframe></section>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
const API='https://script.google.com/macros/s/AKfycbzWkerEeWR-3EjY1QW44Az6pj1TjJK9_ktfnrdcgFILlD6Cnqb4z2X97zSknKRJw-i3jw/exec';
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function tgUser(){const u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};return {id:String(u.id||''),username:String(u.username||''),first:String(u.first_name||''),last:String(u.last_name||'')}}
function trackUrl(partner){const u=tgUser();const click=partner+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);return API+'?action=partner_go&partner='+encodeURIComponent(partner)+'&telegram_user_id='+encodeURIComponent(u.id)+'&telegram_username='+encodeURIComponent(u.username)+'&telegram_first_name='+encodeURIComponent(u.first)+'&telegram_last_name='+encodeURIComponent(u.last)+'&source=telegram_mini_app&lead_click_id='+encodeURIComponent(click)}
function partnerDirect(username,partner){let text='Здравствуйте! Перешёл к вам через партнёрскую кнопку UruWay.';if(partner==='business')text='Здравствуйте! Интересует трансфер BUSINESS. Перешёл к вам через партнёрскую кнопку UruWay.';return 'https://t.me/'+username+'?text='+encodeURIComponent(text)}
async function openPartner(partner,username){
  const direct=partnerDirect(username,partner);
  // Tracking is best-effort: partner opening must never be blocked by a network/CORS problem.
  try{fetch(trackUrl(partner),{method:'GET',mode:'no-cors',cache:'no-store',keepalive:true,credentials:'omit'});}catch(e){}
  try{if(tg&&typeof tg.openTelegramLink==='function'){tg.openTelegramLink(direct);return}}catch(e){}
  try{if(tg&&typeof tg.openLink==='function'){tg.openLink(direct);return}}catch(e){}
  window.location.href=direct;
}
function openBooking(){
  document.getElementById('bookingFrame').src='booking.html?vehicle_class=standard'+(window.location.hash||'');
  show('booking');
  try{if(tg&&tg.BackButton){tg.BackButton.show();}}catch(e){}
}
function backToHub(){document.getElementById('bookingFrame').src='';show('hub');try{if(tg&&tg.BackButton)tg.BackButton.hide();}catch(e){}}
try{if(tg){tg.ready();tg.expand();if(tg.BackButton){tg.BackButton.hide();tg.BackButton.onClick(backToHub);}}}catch(e){}
</script>
</body></html>
