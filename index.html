<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Uruguay Transfer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#f5f7fa; --card:#ffffff; --text:#17202a; --muted:#6b7280;
      --accent:#1593e8; --border:#e5e7eb; --danger:#d92d20;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .app{max-width:520px;margin:0 auto;padding:18px 16px 34px}
    .hero{padding:18px 4px 14px}
    .logo{width:58px;height:58px;border-radius:18px;background:#35c759;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;box-shadow:0 8px 20px rgba(53,199,89,.2)}
    h1{font-size:27px;margin:14px 0 5px}
    .subtitle{color:var(--muted);font-size:15px;line-height:1.45}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
    select,input{width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;padding:13px 12px;font-size:16px;outline:none;color:var(--text)}
    select:focus,input:focus{border-color:var(--accent)}
    .field{margin-bottom:15px}.field:last-child{margin-bottom:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .price{display:flex;align-items:end;justify-content:space-between;margin-top:5px}
    .price .amount{font-size:27px;font-weight:800}
    .price small{color:var(--muted)}
    button{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:750;cursor:pointer}
    .primary{width:100%;background:var(--accent);color:white;margin-top:15px}
    .secondary{width:100%;background:#eef6fd;color:#0b78bf;margin-top:10px}
    .note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:11px}
    .hidden{display:none!important}
    .success{border-color:#b7e4c7;background:#f0fff4}
    .success h2{margin:0 0 8px;font-size:21px}
    .summary{font-size:14px;line-height:1.65}
    .row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--border);padding:7px 0}
    .row:last-child{border-bottom:0}
    .row b{text-align:right}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="logo">UT</div>
      <h1>Uruguay Transfer</h1>
      <div class="subtitle">Предварительное бронирование трансфера в Уругвае</div>
    </section>

    <section class="card" id="bookingCard">
      <div class="field">
        <label for="service">Услуга</label>
        <select id="service">
          <option value="airport">✈️ Трансфер из/в аэропорт</option>
          <option value="hourly">🚗 Автомобиль с водителем</option>
          <option value="pde">🌴 Монтевидео → Пунта-дель-Эсте</option>
        </select>
      </div>

      <div class="grid">
        <div class="field">
          <label for="date">Дата</label>
          <input id="date" type="date">
        </div>
        <div class="field">
          <label for="time">Время</label>
          <input id="time" type="time">
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label for="passengers">Пассажиры</label>
          <select id="passengers">
            <option>1</option><option>2</option><option>3</option>
          </select>
        </div>
        <div class="field">
          <label for="bags">Багаж</label>
          <select id="bags">
            <option>0</option><option>1</option><option>2</option>
            <option>3</option><option>4</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="from">Откуда</label>
        <input id="from" placeholder="Например: аэропорт MVD">
      </div>

      <div class="field">
        <label for="to">Куда</label>
        <input id="to" placeholder="Например: Punta del Este">
      </div>

      <div class="field">
        <label for="contact">Телефон или другой контакт</label>
        <input id="contact" placeholder="+598 ...">
      </div>

      <div class="price">
        <small>Предварительная стоимость</small>
        <div class="amount" id="price">—</div>
      </div>

      <button class="primary" id="submit">Отправить заявку</button>
      <div class="note">На этом первом этапе заявка является предварительной. После получения заявки водитель вручную подтверждает бронирование.</div>
    </section>

    <section class="card success hidden" id="successCard">
      <h2>Заявка отправлена</h2>
      <div class="summary" id="summary"></div>
      <button class="secondary" id="back">Изменить заявку</button>
    </section>
  </main>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    document.documentElement.style.setProperty('--accent', tg.themeParams.button_color || '#1593e8');
  }

  const $ = id => document.getElementById(id);
  const service = $('service'), date = $('date'), time = $('time');
  const passengers = $('passengers'), bags = $('bags');
  const from = $('from'), to = $('to'), contact = $('contact'), price = $('price');

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  date.min = `${yyyy}-${mm}-${dd}`;
  date.value = `${yyyy}-${mm}-${dd}`;

  function money(n){ return n.toLocaleString('ru-RU') + ' UYU'; }

  function calculate(){
    let p = null;
    if(service.value === 'pde') p = 6500;
    if(service.value === 'airport') p = 6500; // временный пример; уточним тарифы
    if(service.value === 'hourly'){
      const h = time.value && Number(time.value.slice(0,2));
      p = h >= 18 ? 500*3 : 550*3; // минимальный заказ 3 часа; позже добавим выбор часов
    }
    price.textContent = p ? money(p) : '—';
    return p;
  }

  [service,time].forEach(el => el.addEventListener('change', calculate));
  calculate();

  $('submit').addEventListener('click', () => {
    if(!date.value || !time.value || !from.value.trim() || !to.value.trim() || !contact.value.trim()){
      alert('Пожалуйста, заполните дату, время, маршрут и контакт.');
      return;
    }
    const p = calculate();
    const text = `
      <div class="row"><span>Услуга</span><b>${service.options[service.selectedIndex].text}</b></div>
      <div class="row"><span>Дата</span><b>${date.value}</b></div>
      <div class="row"><span>Время</span><b>${time.value}</b></div>
      <div class="row"><span>Маршрут</span><b>${from.value} → ${to.value}</b></div>
      <div class="row"><span>Пассажиры</span><b>${passengers.value}</b></div>
      <div class="row"><span>Багаж</span><b>${bags.value}</b></div>
      <div class="row"><span>Контакт</span><b>${contact.value}</b></div>
      <div class="row"><span>Стоимость</span><b>${p ? money(p) : 'уточняется'}</b></div>
    `;
    $('summary').innerHTML = text;
    $('bookingCard').classList.add('hidden');
    $('successCard').classList.remove('hidden');

    // Когда подключим бота, здесь будет реальная отправка заявки.
    if (tg) {
      tg.sendData(JSON.stringify({
        service: service.value, date: date.value, time: time.value,
        from: from.value, to: to.value, passengers: passengers.value,
        bags: bags.value, contact: contact.value, price: p
      }));
    }
  });

  $('back').addEventListener('click', () => {
    $('successCard').classList.add('hidden');
    $('bookingCard').classList.remove('hidden');
  });
</script>
</body>
</html>
