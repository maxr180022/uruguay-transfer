<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
const API='https://uruway-news-bot.uruway.workers.dev/api/news';
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function fmt(v){try{return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function openSource(url){if(!url)return;try{if(tg&&typeof tg.openLink==='function'){tg.openLink(url);return}}catch(e){}location.href=url}
function toggleItem(el){el.closest('.item')?.classList.toggle('open')}
async function loadNews(force){const box=document.getElementById('list');if(force)box.innerHTML='<div class="status">Обновляем…</div>';try{const r=await fetch(API+'?limit=30&_='+Date.now(),{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error('HTTP');const d=await r.json(),items=d&&Array.isArray(d.items)?d.items:[];if(!items.length)throw new Error('empty');box.innerHTML=items.map((n,i)=>'<article class="item"><button class="item-head" type="button" onclick="toggleItem(this)" style="width:100%;border:0;background:transparent;padding:0;text-align:left"><div class="thumb">'+(n.emoji|| (i%2?'🚌':'🇺🇾'))+'</div><div><div class="title">'+esc(n.headline||'Новость')+'</div><div class="time">'+esc(fmt(n.publishedAt||n.savedAt))+'</div></div><div class="arrow">›</div></button><div class="body">'+esc(n.body||'')+(n.sourceUrl?'<div class="source"><button type="button" onclick="openSource(\''+esc(n.sourceUrl)+'\')">Открыть источник</button></div>':'')+'</div></article>').join('')}catch(e){box.innerHTML='<div class="status">Не удалось загрузить новости. Нажмите ↻ и попробуйте ещё раз.</div>'}}
document.addEventListener('DOMContentLoaded',()=>{try{tg?.ready();tg?.expand()}catch(e){}loadNews();setInterval(()=>loadNews(false),5*60*1000)});
</script>
