<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RusWeo · Недвижимость</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--blue:#0874e8;--blue2:#0d5fc9;--pink:#ec087e;--ink:#0b2145;--muted:#667b98;--bg:#eef8ff;--card:#fff;--line:#dfe9f5;--ok:#0d9b64}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef8ff 0,#f9fcff 46%,#f7f9fc 100%);font-family:Inter,Arial,sans-serif;color:var(--ink);padding:12px 12px calc(92px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:auto}.top{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 7px 22px rgba(31,44,65,.07)}.back{width:38px;height:38px;border:0;border-radius:12px;background:#edf5ff;color:var(--blue);font-size:24px;font-weight:900}.logo{height:42px;object-fit:contain}.title{margin-left:auto;text-align:right}.title b{display:block;font-size:17px}.title small{color:var(--muted);font-weight:700}.hero{margin-top:12px;border-radius:24px;padding:18px;background:linear-gradient(135deg,#e7f3ff 0,#f8effa 55%,#fff 100%);border:1px solid #dbe8f6;box-shadow:0 8px 24px rgba(31,44,65,.06)}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#506985;font-weight:700;line-height:1.4}.partner-cta{display:none;width:100%;margin-top:11px;border:0;border-radius:14px;min-height:45px;background:linear-gradient(135deg,var(--pink),#ff4aa2);color:#fff;font-weight:1000;box-shadow:0 6px 16px rgba(236,8,126,.18)}.partner-cta.show{display:block}.filters{display:grid;grid-template-columns:1fr;gap:10px;margin-top:15px}.filter-block{background:rgba(255,255,255,.66);border:1px solid #dfe9f5;border-radius:18px;padding:9px}.filter-label{font-size:10px;font-weight:1000;color:#6b7f98;margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.04em}.chiprow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chip{min-width:0;border:0;border-radius:13px;background:#fff;color:#5c6f89;font-weight:950;min-height:46px;padding:8px 7px;line-height:1.15;white-space:normal;overflow-wrap:anywhere}.chip.active{background:linear-gradient(135deg,var(--blue),#1b8ff1);color:#fff;box-shadow:0 5px 14px rgba(8,116,232,.24)}.chip.city.active{background:linear-gradient(135deg,var(--pink),#ff4aa2);box-shadow:0 5px 14px rgba(236,8,126,.2)}.status{margin:12px 2px 8px;color:var(--muted);font-weight:800;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(31,44,65,.07);min-width:0}.pic{height:150px;background:linear-gradient(135deg,#dff0ff,#fce9f5);display:grid;place-items:center;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.pic .ph{font-size:46px}.badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(5px);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:1000;color:var(--blue)}.body{padding:10px}.price{font-size:17px;font-weight:1000;color:#081e42}.meta{font-size:11px;color:#60738e;font-weight:750;line-height:1.38;margin-top:5px;min-height:30px}.open{width:100%;border:0;border-radius:12px;min-height:38px;background:#eef6ff;color:var(--blue);font-weight:950;margin-top:9px}.empty{grid-column:1/-1;padding:30px 18px;text-align:center;background:#fff;border:1px dashed #cddbea;border-radius:20px;color:#6d7d93;font-weight:800}.sheet{position:fixed;inset:0;z-index:90;display:none;background:rgba(9,30,60,.38);padding:14px;align-items:flex-end}.sheet.open{display:flex}.sheet-card{width:min(100%,720px);max-height:92vh;overflow:auto;margin:0 auto;background:#fff;border-radius:26px 26px 18px 18px;padding:15px;border:1px solid #dfe9f5;box-shadow:0 18px 60px rgba(0,0,0,.18)}.sheet-head{display:flex;align-items:center;gap:9px}.sheet-head h2{margin:0;font-size:21px}.x{margin-left:auto;border:0;width:36px;height:36px;border-radius:12px;background:#edf5ff;color:#0b5cb8;font-size:22px}.gallery{display:flex;gap:8px;overflow:auto;margin:12px -2px;padding:2px}.gallery img,.gallery .ph{width:84%;max-width:500px;height:245px;object-fit:cover;border-radius:18px;flex:0 0 auto;background:linear-gradient(135deg,#dff0ff,#fce9f5);display:grid;place-items:center;font-size:54px}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.detail{background:#f6f9fd;border-radius:12px;padding:9px}.detail small{display:block;color:#71839b;font-size:9px;font-weight:850}.detail b{font-size:13px}.desc{white-space:pre-wrap;color:#3f5674;line-height:1.48;font-size:13px}.cta{width:100%;border:0;border-radius:15px;min-height:50px;background:linear-gradient(135deg,var(--blue),#188bf0);color:#fff;font-size:14px;font-weight:1000}.confirm-copy{background:#f5f9fe;border:1px solid #e2ebf5;border-radius:16px;padding:12px;margin:12px 0;color:#405775;white-space:pre-wrap;line-height:1.42}.cancel{width:100%;border:0;background:transparent;color:#72839a;font-weight:850;padding:12px}.bottom{position:fixed;z-index:70;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 16px),720px);display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:rgba(255,255,255,.96);border:1px solid #dce7f3;border-radius:18px;padding:5px;box-shadow:0 10px 34px rgba(31,44,65,.15);backdrop-filter:blur(12px)}.bottom button{border:0;border-radius:13px;background:transparent;min-height:51px;color:#60738d;font-weight:900;font-size:9.5px}.bottom button.active{background:#edf6ff;color:var(--blue)}.ico{display:block;font-size:19px;margin-bottom:2px}@media(max-width:430px){body{padding-left:9px;padding-right:9px}.grid{gap:7px}.pic{height:128px}.price{font-size:15px}.hero h1{font-size:24px}.chip{font-size:12px;min-height:48px}.bottom{gap:3px;padding:4px}.bottom button{font-size:8.2px;min-height:49px;padding:4px 1px}.ico{font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" onclick="rwBackV82()">‹</button><img class="logo" src="rusweo_logo.png" alt="RusWeo"><div class="title"><b>Недвижимость</b><small>RusWeo · Uruguay</small></div></div>
  <section class="hero"><h1>🏠 Недвижимость</h1><p>Выберите, что вас интересует, и город. Объекты публикуют проверенные партнёры RusWeo.</p><button id="partnerCabinet" class="partner-cta" onclick="openPropertyCabinetV82()">🏠 Управление недвижимостью</button>
    <div class="filters"><div class="filter-block"><div class="filter-label">Тип сделки</div><div class="chiprow"><button class="chip active" data-deal="sale">Продажа</button><button class="chip" data-deal="rent">Аренда</button></div></div><div class="filter-block"><div class="filter-label">Город</div><div class="chiprow"><button class="chip city active" data-city="Montevideo">Монтевидео</button><button class="chip city" data-city="Punta del Este">Пунта-дель-Эсте</button></div></div></div>
  </section>
  <div class="status" id="status">Загружаем объекты…</div><div class="grid" id="grid"></div>
</div>
<div class="sheet" id="detailSheet" onclick="if(event.target===this)closeDetail()"><div class="sheet-card"><div class="sheet-head"><h2 id="dTitle">Объект</h2><button class="x" onclick="closeDetail()">×</button></div><div class="gallery" id="dGallery"></div><div class="details" id="dDetails"></div><div class="desc" id="dDesc"></div><button class="cta" id="dContact">💬 Связаться с риелтором</button></div></div>
<div class="sheet" id="confirmSheet" onclick="if(event.target===this)closeConfirm()"><div class="sheet-card"><div class="sheet-head"><h2>Отправить заявку</h2><button class="x" onclick="closeConfirm()">×</button></div><p style="color:#647892;font-weight:750">Лид появится в RusWeo только после вашего подтверждения.</p><div class="confirm-copy" id="confirmText"></div><button class="cta" id="confirmSend">📨 Отправить заявку риелтору</button><button class="cancel" onclick="closeConfirm()">Отмена</button></div></div>
<nav class="bottom"><button onclick="rwHomeV84()"><span class="ico">⌂</span>Главная</button><button class="active"><span class="ico">⌂</span>Недвижимость</button><button onclick="location.href='guide.html'"><span class="ico">◇</span>Гид</button><button onclick="rwCabinetV84()"><span class="ico">●</span>Кабинет</button></nav>
<script>
const API='https://script.google.com/macros/s/AKfycbzWkerEeWR-3EjY1QW44Az6pj1TjJK9_ktfnrdcgFILlD6Cnqb4z2X97zSknKRJw-i3jw/exec';
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;let DEAL='sale',CITY='Montevideo',ITEMS=[],CURRENT=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsonp(params,timeout=12000){return new Promise((resolve,reject)=>{const cb='RWRE_'+Date.now()+'_'+Math.random().toString(36).slice(2);const sc=document.createElement('script');let done=false;const clean=()=>{try{delete window[cb]}catch(e){};sc.remove()};window[cb]=d=>{done=true;clean();resolve(d)};params.callback=cb;params._=Date.now();sc.src=API+'?'+new URLSearchParams(params);sc.onerror=()=>{if(!done){clean();reject(new Error('network'))}};document.head.appendChild(sc);setTimeout(()=>{if(!done){clean();reject(new Error('timeout'))}},timeout)})}
function auth(){const p={};try{const live=String(tg&&tg.initData||'');const saved=String(sessionStorage.getItem('rw_tg_driver_init_data_v1')||'');const init=live||saved;if(init)p.init_data=init}catch(e){}try{const s=localStorage.getItem('uruway_auth_session');if(s)p.app_session=s}catch(e){}return p}
function operatorAuthV81(){const a=auth(),p={};if(a.init_data)p.operator_init_data=a.init_data;if(a.app_session)p.operator_app_session=a.app_session;return p}
function rwDriverKnownV82(){try{if(String(sessionStorage.getItem('rw_tg_driver_role_v2')||'')==='driver')return true;if(Number(sessionStorage.getItem('rw_driver_verified_until_v82')||0)>Date.now())return true}catch(e){}try{return String(localStorage.getItem('uruway_auth_role')||'')==='driver_standard'&&!!String(localStorage.getItem('uruway_auth_session')||'')}catch(e){return false}}
function rwPartnerKnownV82(){try{return sessionStorage.getItem('rw_re_partner_mode_v82')==='1'}catch(e){return false}}
function rwBackV82(){try{if(history.length>1){history.back();return}}catch(e){}rwHomeV82()}
function rwIndexReturnV84(target){
  target=String(target||'home');
  try{localStorage.setItem('rw_internal_nav_v84',JSON.stringify({target,until:Date.now()+45000}))}catch(e){}
  const from=(new URLSearchParams(location.search)).get('from')||'';
  if(from==='index'&&history.length>1){history.back();return}
  const tail=target==='account'?'&view=account':'';
  location.replace('index.html?rw_internal=1'+tail);
}
function rwHomeV84(){rwIndexReturnV84('home')}
function rwCabinetV84(){rwIndexReturnV84('account')}
let RW82_CABINET_MODE='';function openPropertyCabinetV82(){if(RW82_CABINET_MODE==='admin'){location.href='realestate-admin.html?v=40004';return}location.href='realestate-partner.html?v=40004'}
function photoUrl(id){return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200':''}
function money(x,c){const n=Number(x);return (c==='UYU'?'$ ':'US$ ')+(Number.isFinite(n)?n.toLocaleString('ru-RU'):esc(x||''))}
function catalogCacheKeyV84(){return 'rw_re_catalog_v84_'+String(DEAL||'all')+'_'+String(CITY||'all').replace(/\s+/g,'_')}
function readCatalogCacheV84(){try{const x=JSON.parse(localStorage.getItem(catalogCacheKeyV84())||'null');return x&&Date.now()-Number(x.at||0)<10*60*1000?x:null}catch(e){return null}}
function writeCatalogCacheV84(items){try{localStorage.setItem(catalogCacheKeyV84(),JSON.stringify({at:Date.now(),items:items||[]}))}catch(e){}}
async function load(){
  const cached=readCatalogCacheV84();
  if(cached){ITEMS=cached.items||[];render();document.getElementById('status').textContent='Обновляем объекты…'}
  else document.getElementById('status').textContent='Загружаем объекты…';
  try{
    const d=await jsonp({action:'realestate_list_v400',deal_type:DEAL,city:CITY},7000);
    if(!d||!d.ok)throw new Error(d&&d.error||'load');
    ITEMS=d.items||[];writeCatalogCacheV84(ITEMS);render();
    const q=new URLSearchParams(location.search).get('property');if(q){const it=ITEMS.find(x=>x.property_id===q);if(it)openDetail(it)}
  }catch(e){
    if(cached){document.getElementById('status').textContent='Показаны сохранённые данные.';return}
    document.getElementById('status').textContent='Не удалось загрузить каталог.';document.getElementById('grid').innerHTML='<div class="empty">Попробуйте открыть раздел ещё раз.</div>'
  }
}
function render(){document.getElementById('status').textContent=(DEAL==='sale'?'Продажа':'Аренда')+' · '+CITY+' · '+ITEMS.length+' объект(ов)';const g=document.getElementById('grid');if(!ITEMS.length){g.innerHTML='<div class="empty">Сейчас в этом разделе нет активных объектов.</div>';return}g.innerHTML=ITEMS.map((x,i)=>{const p=(x.photo_ids||[])[0];return '<article class="card"><div class="pic">'+(p?'<img src="'+photoUrl(p)+'" alt="Объект">':'<div class="ph">🏠</div>')+'<span class="badge">'+esc(x.property_type||'Объект')+'</span></div><div class="body"><div class="price">'+money(x.price,x.currency)+'</div><div class="meta">'+esc(x.city)+(x.district?' · '+esc(x.district):'')+'<br>'+esc(x.address||'')+'</div><button class="open" onclick="openDetail(ITEMS['+i+'])">Открыть объект →</button></div></article>'}).join('')}
function openDetail(x){CURRENT=x;document.getElementById('dTitle').textContent=x.property_id+' · '+(x.deal_type==='rent'?'Аренда':'Продажа');const ps=x.photo_ids||[];document.getElementById('dGallery').innerHTML=ps.length?ps.map(id=>'<img src="'+photoUrl(id)+'" alt="Фото объекта">').join(''):'<div class="ph">🏠</div>';const vals=[['Стоимость',money(x.price,x.currency)],['Город',x.city],['Тип',x.property_type||'—'],['Район',x.district||'—'],['Площадь',x.area_m2?x.area_m2+' м²':'—'],['Спальни / санузлы',(x.bedrooms||'—')+' / '+(x.bathrooms||'—')]];document.getElementById('dDetails').innerHTML=vals.map(v=>'<div class="detail"><small>'+esc(v[0])+'</small><b>'+esc(v[1])+'</b></div>').join('');document.getElementById('dDesc').textContent=(x.address?x.address+'\n\n':'')+(x.description||'');document.getElementById('dContact').onclick=()=>openConfirm(x);document.getElementById('detailSheet').classList.add('open')}
function closeDetail(){document.getElementById('detailSheet').classList.remove('open')}
function openConfirm(x){const text='Здравствуйте! Меня интересует объект '+x.property_id+' в '+x.city+' ('+money(x.price,x.currency)+'). Нашёл объект в RusWeo.';document.getElementById('confirmText').textContent=text;document.getElementById('confirmSend').onclick=()=>sendLead(x,text);document.getElementById('confirmSheet').classList.add('open')}
function closeConfirm(){document.getElementById('confirmSheet').classList.remove('open')}
async function sendLead(x,text){const b=document.getElementById('confirmSend');b.disabled=true;b.textContent='Отправляем…';try{const p=Object.assign({action:'realestate_lead_confirm_v400',property_id:x.property_id,source:(window.UruWayAndroid?'android':'telegram')},auth());const d=await jsonp(p,15000);if(!d||!d.ok)throw new Error(d&&d.error||'lead');closeConfirm();if(d.target_url){try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(d.target_url);return}}catch(e){}location.href=d.target_url}else alert('Заявка отправлена риелтору.')}catch(e){alert(e.message==='unauthorized'?'Откройте недвижимость через приложение RusWeo или Telegram-бот.':'Не удалось отправить заявку. Попробуйте ещё раз.')}finally{b.disabled=false;b.textContent='📨 Отправить заявку риелтору'}}
async function checkPartnerCabinet(){const b=document.getElementById('partnerCabinet');if(rwDriverKnownV82()){RW82_CABINET_MODE='admin';b.textContent='🏠 Управление недвижимостью';b.classList.add('show');return}if(rwPartnerKnownV82()){RW82_CABINET_MODE='partner';b.textContent='🏠 Кабинет риелтора';b.classList.add('show');return}try{const d=await jsonp(Object.assign({action:'realestate_partner_snapshot_v400'},auth()),7000);if(d&&d.ok){RW82_CABINET_MODE=d.is_admin?'admin':'partner';try{if(d.is_admin){sessionStorage.setItem('rw_re_admin_mode_v82','1');if(d.admin_token)sessionStorage.setItem('rw_re_admin_token_v82',String(d.admin_token))}else sessionStorage.setItem('rw_re_partner_mode_v82','1')}catch(e){}b.textContent=d.is_admin?'🏠 Управление недвижимостью':'🏠 Кабинет риелтора';b.classList.add('show')}}catch(e){}}
document.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-deal]').forEach(x=>x.classList.remove('active'));b.classList.add('active');DEAL=b.dataset.deal;load()});document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-city]').forEach(x=>x.classList.remove('active'));b.classList.add('active');CITY=b.dataset.city;load()});load();checkPartnerCabinet();
</script>
</body></html>
