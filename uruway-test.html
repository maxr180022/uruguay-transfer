<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UruWay Transfer — TEST</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #121820;
    }

    .card {
      max-width: 600px;
      margin: 0 auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 15px;
      margin-top: 20px;
      border-radius: 12px;
      background: #eef8ff;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1593e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    pre {
      margin-top: 20px;
      padding: 15px;
      background: #111820;
      color: #fff;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🚗 UruWay Transfer</h1>

  <p>
    TEST-версия нового приложения
  </p>

  <div class="status">
    🟢 TEST FRONTEND ЗАПУЩЕН
  </div>

  <button onclick="testAPI()">
    🔌 Проверить новый API
  </button>

  <pre id="result">Нажми кнопку для проверки API...</pre>

</div>

<script>

const API_URL =
  "https://uruway-api-test.uruway.workers.dev";

async function testAPI() {

  const result = document.getElementById("result");

  result.textContent = "⏳ Подключаемся к Cloudflare API...";

  try {

    const response = await fetch(
      API_URL + "/health"
    );

    const data = await response.json();

    result.textContent =
      "HTTP " + response.status +
      "\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {

    result.textContent =
      "❌ ОШИБКА ПОДКЛЮЧЕНИЯ\n\n" +
      error.message;

  }

}

</script>

</body>
</html>
