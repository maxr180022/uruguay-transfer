<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UruWay Transfer — TEST</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #121820;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 14px;
      margin: 15px 0;
      border-radius: 12px;
      background: #eef8ff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1593e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .5;
    }

    .tariff {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      cursor: pointer;
    }

    .tariff:hover {
      background: #f7fbff;
    }

    .tariff-title {
      font-weight: bold;
      font-size: 17px;
    }

    .price {
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    pre {
      margin-top: 20px;
      padding: 15px;
      background: #111820;
      color: white;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    #tariffs {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🚗 UruWay Transfer</h1>

  <div class="status">
    🟢 TEST-приложение подключено к новому API
  </div>

  <button id="loadButton" onclick="loadTariffs()">
    Загрузить тарифы
  </button>

  <div id="tariffs"></div>

  <pre id="result">Нажми «Загрузить тарифы»...</pre>

</div>

<script>

const API_URL =
  "https://uruway-api-test.uruway.workers.dev";

async function loadTariffs() {

  const button =
    document.getElementById("loadButton");

  const tariffs =
    document.getElementById("tariffs");

  const result =
    document.getElementById("result");

  button.disabled = true;

  tariffs.innerHTML = "";

  result.textContent =
    "⏳ Загружаем реальные тарифы из Supabase...";

  try {

    const response = await fetch(
      API_URL + "/v1/tariffs"
    );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.error || "API ERROR"
      );
    }

    const list =
      Array.isArray(data.data)
        ? data.data
        : [];

    result.textContent =
      "✅ Получено тарифов: " +
      list.length;

    if (!list.length) {

      tariffs.innerHTML =
        "<p>Тарифов пока нет.</p>";

      return;
    }

    list.forEach(tariff => {

      const div =
        document.createElement("div");

      div.className = "tariff";

      const route =
        tariff.route || {};

      const origin =
        route.origin_name || "";

      const destination =
        route.destination_name || "";

      const title =
        route.name ||
        `${origin} → ${destination}`;

      const price =
        tariff.price;

      const currency =
        tariff.currency || "";

      const vehicle =
        tariff.vehicle_class_id;

      div.innerHTML = `
        <div class="tariff-title">
          ${escapeHtml(title)}
        </div>

        <div>
          Класс автомобиля: ${vehicle ?? "—"}
        </div>

        <div class="price">
          ${escapeHtml(String(price))}
          ${escapeHtml(currency)}
        </div>
      `;

      tariffs.appendChild(div);

    });

  } catch (error) {

    result.textContent =
      "❌ ОШИБКА\n\n" +
      error.message;

  } finally {

    button.disabled = false;

  }
}

function escapeHtml(value) {

  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
