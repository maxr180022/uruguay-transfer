<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>UruWay Transfer — TEST</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #121820;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 14px;
      margin: 15px 0;
      border-radius: 12px;
      background: #eef8ff;
    }

    .section {
      margin-top: 25px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .vehicle {
      padding: 16px;
      margin-bottom: 10px;
      border: 2px solid #ddd;
      border-radius: 14px;
      cursor: pointer;
    }

    .vehicle.selected {
      border-color: #1593e8;
      background: #eef8ff;
    }

    .vehicle-name {
      font-size: 18px;
      font-weight: bold;
    }

    .vehicle-info {
      margin-top: 5px;
      color: #555;
    }

    .tariff {
      padding: 16px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 14px;
    }

    .tariff-title {
      font-weight: bold;
    }

    .price {
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1593e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      opacity: .5;
    }

    pre {
      margin-top: 20px;
      padding: 15px;
      background: #111820;
      color: white;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🚗 UruWay Transfer</h1>

  <div class="status">
    🟢 TEST-приложение
  </div>

  <div class="section">

    <div class="section-title">
      Выберите автомобиль
    </div>

    <div id="vehicles">
      Загружаем автомобили...
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Доступные тарифы
    </div>

    <div id="tariffs">
      Выберите автомобиль
    </div>

  </div>

  <button id="reloadButton">
    🔄 Обновить тарифы
  </button>

  <pre id="result">
Подключаемся к API...
  </pre>

</div>

<script>

const API_URL =
  "https://uruway-api-test.uruway.workers.dev";

let tariffs = [];
let selectedVehicleClass = null;

const vehicleNames = {
  1: {
    name: "Renault Kwid",
    info: "Водитель + до 3 пассажиров"
  },

  2: {
    name: "Hyundai H-1",
    info: "Водитель + до 8 пассажиров"
  }
};

async function loadTariffs() {

  const vehicles =
    document.getElementById("vehicles");

  const tariffsBox =
    document.getElementById("tariffs");

  const result =
    document.getElementById("result");

  vehicles.innerHTML =
    "⏳ Загружаем автомобили...";

  tariffsBox.innerHTML =
    "⏳ Загружаем тарифы...";

  result.textContent =
    "⏳ Запрос к Cloudflare API...";

  try {

    const response =
      await fetch(
        API_URL + "/v1/tariffs"
      );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.error || "API ERROR"
      );
    }

    tariffs =
      Array.isArray(data.data)
        ? data.data
        : [];

    result.textContent =
      "✅ Получено тарифов: " +
      tariffs.length;

    renderVehicles();

    if (
      selectedVehicleClass === null
    ) {

      const first =
        [...new Set(
          tariffs
            .map(t => t.vehicle_class_id)
            .filter(Boolean)
        )][0];

      if (first) {
        selectVehicle(first);
      }

    } else {

      renderTariffs();

    }

  } catch (error) {

    vehicles.innerHTML =
      "❌ Не удалось загрузить автомобили";

    tariffsBox.innerHTML =
      "";

    result.textContent =
      "❌ ОШИБКА\n\n" +
      error.message;
  }
}

function renderVehicles() {

  const box =
    document.getElementById("vehicles");

  const classes =
    [...new Set(
      tariffs
        .map(t => t.vehicle_class_id)
        .filter(Boolean)
    )];

  if (!classes.length) {

    box.innerHTML =
      "<p>Классы автомобилей не найдены.</p>";

    return;
  }

  box.innerHTML = "";

  classes.forEach(id => {

    const vehicle =
      vehicleNames[id] || {
        name: "Автомобиль класса " + id,
        info: "Информация уточняется"
      };

    const div =
      document.createElement("div");

    div.className =
      "vehicle" +
      (
        selectedVehicleClass === id
          ? " selected"
          : ""
      );

    div.innerHTML = `
      <div class="vehicle-name">
        ${escapeHtml(vehicle.name)}
      </div>

      <div class="vehicle-info">
        ${escapeHtml(vehicle.info)}
      </div>
    `;

    div.onclick = () =>
      selectVehicle(id);

    box.appendChild(div);

  });
}

function selectVehicle(id) {

  selectedVehicleClass = id;

  renderVehicles();
  renderTariffs();
}

function renderTariffs() {

  const box =
    document.getElementById("tariffs");

  if (
    selectedVehicleClass === null
  ) {

    box.innerHTML =
      "Выберите автомобиль.";

    return;
  }

  const filtered =
    tariffs.filter(
      tariff =>
        Number(
          tariff.vehicle_class_id
        ) ===
        Number(
          selectedVehicleClass
        )
    );

  if (!filtered.length) {

    box.innerHTML =
      "Для этого автомобиля тарифов пока нет.";

    return;
  }

  box.innerHTML = "";

  filtered.forEach(tariff => {

    const route =
      tariff.route || {};

    const title =
      route.name ||
      (
        (route.origin_name || "") +
        " → " +
        (route.destination_name || "")
      );

    const div =
      document.createElement("div");

    div.className =
      "tariff";

    div.innerHTML = `
      <div class="tariff-title">
        ${escapeHtml(title)}
      </div>

      <div>
        ${escapeHtml(
          tariff.pricing_type || ""
        )}
      </div>

      <div class="price">
        ${escapeHtml(
          String(tariff.price)
        )}
        ${escapeHtml(
          tariff.currency || ""
        )}
      </div>
    `;

    box.appendChild(div);

  });
}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

document
  .getElementById("reloadButton")
  .addEventListener(
    "click",
    loadTariffs
  );

loadTariffs();

</script>

</body>
</html>
